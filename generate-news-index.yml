name: Generate news file index

on:
  push:
    branches: [main]
    paths:
      - 'news/**'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Generate news-files.json
        run: |
          echo "[" > news-files.json
          first=true
          for f in news/*; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            ext="${name##*.}"
            case "$ext" in
              txt|md|docx) ;;
              *) continue ;;
            esac
            size=$(stat -c%s "$f")
            date=$(git log --diff-filter=A --follow --format=%cI -- "$f" | tail -1)
            # На случай, если файл только что добавлен и ещё не закоммичен под git log --follow
            if [ -z "$date" ]; then
              date=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            fi
            if [ "$first" = true ]; then first=false; else echo "," >> news-files.json; fi
            printf '  {"name": "%s", "size": %s, "date": "%s"}' "$name" "$size" "$date" >> news-files.json
          done
          echo "" >> news-files.json
          echo "]" >> news-files.json
          cat news-files.json

      - name: Commit updated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news-files.json
          git diff --quiet --cached || git commit -m "Auto-update news-files.json"
          git push
